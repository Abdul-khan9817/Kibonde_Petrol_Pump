<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="images/logo.png" type="image/png" />
<title>Kibonde Fuels</title>
<style>
:root {
  --accent: #0b76ef;
  --orange: #FF9900;
  --black: #0B1F3F;
  --white: #ffffff;
  --overlay: rgba(0,0,0,0.4);
  --card-bg: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; margin:0; padding:0; font-family: Inter, sans-serif; }

body {
  min-height: 100vh;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: linear-gradient(135deg, var(--black), var(--accent));
  color: var(--white);
  padding: 24px;
}
body::before {
  content: "";
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background: var(--overlay);
  z-index: -1;
}

header {
  padding: 16px 24px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  margin-bottom: 32px;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: var(--card-bg);
  padding: 32px;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  max-height: 80vh;
  overflow-y: auto;
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE and Edge */
}
.container::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}
}

h1 { text-align: center; margin-bottom: 24px; font-size: 32px; }

label { display:block; margin-top: 12px; margin-bottom:4px; font-size:14px; color:var(--white); }
input, textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.05);
  color:var(--white);
  font-size:14px;
}

button {
  margin-top: 20px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:12px;
  font-weight:600;
  background:var(--accent);
  color:var(--white);
  cursor:pointer;
  transition: transform 0.2s, background 0.2s;
}

button:hover { background:var(--orange); transform: translateY(-2px); }

.msg {
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  margin-top: 12px;
}
.msg.success { background: #065f46; color: #ecfdf5; }
.msg.error { background: #991b1b; color: #fff1f2; }

.spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  border-left-color: white;
  display: inline-block;
  vertical-align: middle;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width: 480px) {
  .container { padding: 24px; border-radius: 12px; }
  h1 { font-size: 24px; }
}
</style>
</head>
<body>

<header style="display:flex;align-items:center;gap:12px;">
  <span id="backArrow" style="cursor:pointer;font-size:28px;line-height:1;user-select:none;">&#8592;</span>
  <span style="flex:1;text-align:center;">Contact Us</span>
</header>

<div class="container">
  <h1>Get in Touch</h1>
  <p>If you have any questions, inquiries, or feedback, feel free to reach out to us. Our team is here to help and provide information regarding our fuel supply services.</p>

  <div id="message" aria-live="polite"></div>

  <form id="contactForm">
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Your Name" required>

    <label for="contactNo">Contact No</label>
    <input id="contactNo" type="text" placeholder="Your Contact Number" required>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Your Email" required>

    <label for="messageInput">Message</label>
    <textarea id="messageInput" rows="5" placeholder="Write your message..." required></textarea>

    <button type="submit" id="submitBtn">Send Message</button>
    <button type="button" id="logoutBtn" style="margin-top:12px;background:#d7263d;">Logout</button>
  </form>

</div>

<script src="./frontend-api.js"></script>
<script type="module">
// Logout button logic: clear user info and go to home page
const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('user_id');
    localStorage.removeItem('user_name');
    window.location.href = 'index.html';
  });
}
// Back arrow navigates to home page
document.getElementById('backArrow').addEventListener('click', () => {
  window.location.href = 'index.html';
});
const api = window.KibondeAPI;

const contactForm = document.getElementById('contactForm');
const messageEl = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(text, type='success'){
  messageEl.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

function clearMessage(){ messageEl.innerHTML = ''; }

contactForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage();

  const name = document.getElementById('name').value.trim();
  const contact_no = document.getElementById('contactNo').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('messageInput').value.trim();

  submitBtn.disabled = true;
  const prevText = submitBtn.textContent;
  submitBtn.innerHTML = '<span class="spinner"></span> Sending...';

  try {
    await api.createMessage({ name, contact_no, email, message });
      showMessage('Thank you! Your message has been sent.', 'success');
      contactForm.reset();
  } catch (err) {
    console.error(err);
    showMessage('Unexpected error occurred', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = prevText;
  }
});
</script>

</body>
</html>

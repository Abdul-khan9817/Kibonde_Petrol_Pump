<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <title>Kibonde Fuels</title>
  <style>
    :root {
      --orange: #FF9900;
      --blue: #009CFF;
      --black: #0B1F3F;
      --white: #ffffff;
      --overlay: rgba(0,0,0,0.4);
      --card-bg: rgba(255,255,255,0.05);
    }

    * { box-sizing: border-box; margin:0; padding:0; font-family: Inter, sans-serif; }

    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--black), var(--blue));
      color: var(--white);
    }
    body::before {
      content: "";
      position: fixed;
      top:0; left:0;
      width:100%;
      height:100%;
      background: var(--overlay);
      z-index: -1;
    }

    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 1000px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 { margin-bottom: 24px; font-size: 28px; color: var(--white); text-shadow: 1px 1px 6px rgba(0,0,0,0.5); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      color: var(--white);
    }
    th, td {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 14px;
      text-align: center;
    }
    th {
      background: var(--orange);
      color: var(--white);
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    .no-orders {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.7);
    }

    button {
      padding: 12px 24px;
      margin-top: 24px;
      background: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    button:hover {
      background: var(--blue);
      transform: translateY(-2px);
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      color: var(--white);
      padding: 24px;
      font-size: 13px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    footer a { color: var(--white); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--orange); }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Your Orders</h1>
    <div id="ordersContainer"></div>
    <button id="backBtn">Back to Main Page</button>
  </div>
</div>

<footer>
  <a href="contact.html">Contact</a>
  <a href="help.html">Help</a>
  <a href="about.html">About</a>
</footer>

<script src="./frontend-api.js"></script>
<script type="module">
  const api = window.KibondeAPI;

  const ordersContainer = document.getElementById('ordersContainer');
  const backBtn = document.getElementById('backBtn');

  const userId = localStorage.getItem('user_id');
  const userName = localStorage.getItem('user_name') || 'User';

  if(!userId){
    alert('No user logged in. Redirecting to login page.');
    window.location.href = 'login.html';
  }

  backBtn.addEventListener('click', () => {
    window.location.href = 'mainpage.html';
  });

  async function loadOrders(){
    try {
      const { data: orders } = await api.listOrders(userId);

      if(!orders || orders.length === 0){
        ordersContainer.innerHTML = `<p class="no-orders">You have no orders yet.</p>`;
        return;
      }

      let tableHTML = `<table>
      <thead>
        <tr>
          <th>Order #</th>
          <th>Fuel</th>
          <th>Litres</th>
          <th>Price ($)</th>
          <th>Mode</th>
          <th>Location</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>`;

      orders.forEach(order => {
        tableHTML += `<tr>
        <td>${order.order_number || '-'}</td>
        <td>${order.fuel_type || '-'}</td>
        <td>${order.number_of_litres || '-'}</td>
        <td>${order.price || '-'}</td>
        <td>${order.mode_of_payment || '-'}</td>
        <td>${order.delivery_location || '-'}</td>
        <td>${order.status || '-'}</td>
      </tr>`;
      });

      tableHTML += `</tbody></table>`;
      ordersContainer.innerHTML = tableHTML;
    } catch (error) {
      ordersContainer.innerHTML = `<p class="no-orders">Error fetching orders: ${error.message}</p>`;
    }
  }

  loadOrders();
</script>

</body>
</html>

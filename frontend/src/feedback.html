<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="images/logo.png" type="image/png" />
<title>Kibonde Fuels</title>
<style>
:root {
  --accent: #0b76ef;
  --orange: #FF9900;
  --black: #0B1F3F;
  --white: #ffffff;
  --overlay: rgba(0,0,0,0.4);
  --card-bg: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; margin:0; padding:0; font-family: Inter, sans-serif; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(135deg, var(--black), var(--accent));
  color: var(--white);
  padding: 24px;
}
body::before {
  content: "";
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background: var(--overlay);
  z-index: -1;
}

header {
  padding: 16px 24px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  margin-bottom: 32px;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: var(--card-bg);
  padding: 32px;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

h1 { text-align: center; margin-bottom: 24px; font-size: 32px; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  text-align: left;
  font-size: 14px;
  color: var(--white);
}
th { font-weight: 600; }
tr:nth-child(even) { background: rgba(255,255,255,0.05); }

.msg {
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 12px;
}
.msg.success { background: #065f46; color: #ecfdf5; }
.msg.error { background: #991b1b; color: #fff1f2; }

.spinner {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  border-left-color: white;
  display: inline-block;
  vertical-align: middle;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width: 600px) {
  .container { padding: 24px; border-radius: 12px; }
  h1 { font-size: 24px; }
  th, td { font-size: 12px; padding: 8px; }
}
</style>
</head>
<body>

<header>Contact Messages Dashboard</header>

<div class="container">
  <div id="message" aria-live="polite"></div>
  <h1>Messages</h1>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Submitted At</th>
      </tr>
    </thead>
    <tbody id="messagesTable">
      <tr><td colspan="6" style="text-align:center;">Loading messages...</td></tr>
    </tbody>
  </table>
</div>

<script src="./frontend-api.js"></script>
<script type="module">
const api = window.KibondeAPI;

const messagesTable = document.getElementById('messagesTable');
const messageEl = document.getElementById('message');

function showMessage(text, type='success'){
  messageEl.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

async function loadMessages() {
  try {
    const { data } = await api.listMessages();

    if (!data) {
      showMessage('Failed to load messages', 'error');
      messagesTable.innerHTML = '<tr><td colspan="5" style="text-align:center;">Failed to load messages</td></tr>';
      return;
    }

    if (data.length === 0) {
      messagesTable.innerHTML = '<tr><td colspan="5" style="text-align:center;">No messages found</td></tr>';
      return;
    }

    messagesTable.innerHTML = '';
    data.forEach((msg, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${msg.name}</td>
        <td>${msg.email}</td>
        <td>${msg.message}</td>
        <td>${new Date(msg.created_at).toLocaleString()}</td>
      `;
      messagesTable.appendChild(tr);
    });

  } catch (err) {
    console.error(err);
    showMessage('Unexpected error occurred', 'error');
  }
}

// Load messages on page load
loadMessages();
</script>

</body>
</html>

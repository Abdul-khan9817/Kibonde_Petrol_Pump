<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <title>Kibonde Fuels</title>
  <style>
    :root {
      --orange: #FF9900;
      --blue: #009CFF;
      --black: #0B1F3F;
      --white: #ffffff;
      --card-bg: rgba(255,255,255,0.05);
      --overlay: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin:0; padding:0; font-family: Inter, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--black), #009CFF);
      color: var(--white);
      padding: 24px;
    }
    body::before {
      content: "";
      position: fixed;
      top:0; left:0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      z-index: -1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      color: var(--white);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: var(--white);
    }
    h1 {
      font-size: 24px;
      margin: 0;
    }
    p.lead {
      margin: 6px 0 18px 0;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }

    form { display: grid; gap: 16px; }
    label { font-size: 13px; color: rgba(255,255,255,0.8); }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
      color: var(--white);
      font-size: 14px;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }

    button {
      background: var(--orange);
      color: var(--white);
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { background: var(--blue); transform: translateY(-2px); }

    .toggle-btn {
      background: transparent;
      border: 0;
      color: #FF9900;
      cursor: pointer;
      font-weight: 700;
      margin-top: 12px;
      text-align: center;
      width: 100%;
      display: block;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transition: color 0.2s;
    }

    .toggle-btn:hover, .toggle-btn:focus {
      color: #fff;
      background: var(--blue);
      outline: none;
    }

    .msg {
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .msg.success { background: #065f46; color: #ecfdf5; }
    .msg.error { background: #991b1b; color: #fff1f2; }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      border-left-color: white;
      display: inline-block;
      vertical-align: middle;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media(max-width: 480px) {
      .card { padding: 24px; border-radius: 12px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <div class="logo">KF</div>
      <div>
        <h1>Kibonde Fuels</h1>
        <p class="lead" id="formLead">Sign in with your email and password</p>
      </div>
    </header>

    <div id="message" aria-live="polite"></div>

    <form id="authForm">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" />
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required />
      </div>

      <div>
        <label for="mobile">Mobile Number</label>
        <input id="mobile" name="mobile" type="text" />
      </div>

      <div>
        <button id="submitBtn" type="submit">Sign in</button>
      </div>

      <button type="button" id="toggleBtn" class="toggle-btn">Don't have an account? Sign up</button>
      <button type="button" id="backHomeBtn" class="toggle-btn" style="color:#009cff;margin-top:8px;">Back to Home</button>
    </form>
  </main>

  <script src="./frontend-api.js"></script>
  <script type="module">
        // Back to Home button
        document.getElementById('backHomeBtn').addEventListener('click', () => {
          window.location.href = 'index.html';
        });
    const api = window.KibondeAPI;

    const authForm = document.getElementById('authForm');
    const toggleBtn = document.getElementById('toggleBtn');
    const submitBtn = document.getElementById('submitBtn');
    const formLead = document.getElementById('formLead');
    const messageEl = document.getElementById('message');
    let isSignUp = false;

    function showMessage(text, type='success'){
      messageEl.innerHTML = `<div class="msg ${type}">${text}</div>`;
    }

    function clearMessage(){ messageEl.innerHTML = ''; }

    function getFriendlyErrorMessage(error, fallback) {
      const message = String(error?.message || '');
      if (/failed to fetch|networkerror|load failed/i.test(message)) {
        return 'Cannot connect to server. Start backend on port 5000 and try again.';
      }
      return message || fallback;
    }

    toggleBtn.addEventListener('click', ()=>{
      isSignUp = !isSignUp;
      submitBtn.textContent = isSignUp ? 'Sign up' : 'Sign in';
      formLead.textContent = isSignUp ? 'Create your account' : 'Sign in with your email and password';
      toggleBtn.textContent = isSignUp ? 'Already have an account? Sign in' : 'Don\'t have an account? Sign up';
      document.getElementById('name').required = isSignUp;
    });

    authForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      clearMessage();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const mobile = document.getElementById('mobile').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Processing...';

      try{
        if(isSignUp){
          await api.signupUser({ name, email, password, mobile_number: mobile });
          showMessage('Account created successfully. You can now sign in.', 'success');
          toggleBtn.click();
        } else {
          const { data } = await api.signinUser({ email, password });

          if(!data){
            showMessage('Invalid email or password', 'error');
          } else {
            showMessage(`Welcome, ${data.name}!`, 'success');
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('user_name', data.name);
            window.location.href = 'mainpage.html';
          }
        }
      } catch(err){
        console.error(err);
        showMessage(getFriendlyErrorMessage(err, 'Unexpected error occurred.'), 'error');
      } finally{
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUp ? 'Sign up' : 'Sign in';
      }
    });
  </script>
</body>
</html>
